spring.application.name=CargoZen

server.port=8081

#=======================================================
#   GROQ OPENAI CONFIGURATION
#=======================================================
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.2

#===========================================
#   Ollama Configuration
#==========================================

#spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.options.model=codellama:latest
#spring.ai.ollama.chat.options.temperature=0.7

#====================================================
#       CUSTOM VALUES
#====================================================
cargozen_backend_url=${API_URL}

#The maximum size allowed for a single uploaded file.
spring.servlet.multipart.max-file-size=1000MB  
#The total size of the entire request (all form data + all files combined).
spring.servlet.multipart.max-request-size=10000MB