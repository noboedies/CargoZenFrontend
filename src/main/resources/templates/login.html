<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in — CargoZen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/static/assets/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div style="max-width:420px;">
      <span class="hero-eyebrow">Welcome back</span>
      <h2 class="mt-3" style="color:var(--paper);">Pick up right where the manifest left off.</h2>
      <p class="text-muted-light mt-3">Log in as a customer to track a shipment, as a driver to see your queue, or as admin to manage the network.</p>
      <div class="panel mt-5">
        <img class="img-fluid" alt="" src="/static/assets/images/delivery.gif">
    </div>
  </div>
</div>
  <div class="auth-form-side">
    <div class="auth-card">
      <a href="/" class="navbar-brand d-inline-flex mb-4"><span class="brand-mark">CZ</span>CargoZen</a>
      <h3>Log in</h3>
      <p class="text-muted-light small mb-4">Choose your role to continue.</p>

      <ul class="nav nav-pills mb-4 gap-2" id="roleTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active btn-ghost-light" id="tab-customer" data-bs-toggle="pill" data-bs-target="#pane-customer" type="button" data-role="customer">
            <i class="bi bi-person-badge me-1"></i>Customer
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link btn-ghost-light" id="tab-driver" data-bs-toggle="pill" data-bs-target="#pane-driver" type="button" data-role="driver">
            <i class="bi bi-truck me-1"></i>Driver
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link btn-ghost-light" id="tab-admin" data-bs-toggle="pill" data-bs-target="#pane-admin" type="button" data-role="admin">
            <i class="bi bi-shield-check me-1"></i>Admin
          </button>
        </li>
      </ul>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" class="form-control" id="lEmail" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="lPassword" required>
        </div>
        <div id="lError" class="text-danger small mt-2 d-none"></div>
        <button type="submit" class="btn btn-amber w-100 mt-3" id="loginBtn">Log in as customer</button>
      </form>

      <p class="text-muted-light small mt-4 text-center">New here? <a href="register.html" class="text-amber">Create an account</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/assets/js/store.js"></script>
<script src="/static/assets/js/app.js"></script>
</body>
</html>
